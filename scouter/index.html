<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMS Scouter</title>
  <meta name="description" content="MapleScouter-style spec calculator for GMS: Scouter score, boss clear estimates, stat efficiency, upgrade cost vs gain, gear with item icons, boss income for mules, and familiar, hyper stat, legion and HEXA optimizers.">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <div class="title">GMS Scouter</div>
        <div class="subtitle">Spec score · Boss cut · Upgrade planner</div>
      </div>
    </div>
    <div class="char-switch">
      <label for="charSelect" class="muted">Character</label>
      <select id="charSelect" aria-label="Character"></select>
      <button class="btn ghost small" id="btnNewChar" title="Create a new character">+ New</button>
    </div>
    <div class="score-pill" id="headerScore"></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnShare" title="Copy a link containing this character">Share link</button>
      <button class="btn ghost" id="btnTheme" title="Switch theme">☀ Light</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="character" class="active">Character</button>
    <button data-tab="scouter">Scouter &amp; Bosses</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="efficiency">Efficiency</button>
    <button data-tab="upgrades">Upgrades</button>
    <button data-tab="optimize">Optimize</button>
    <button data-tab="hexa">HEXA</button>
    <button data-tab="itemmaker">Item Maker</button>
    <button data-tab="starforce">Star Force</button>
    <button data-tab="dojo">Mu Lung</button>
    <button data-tab="income">Boss Income</button>
    <button data-tab="compare">Characters</button>
    <button data-tab="data">Data</button>
    <button data-tab="about">Guide</button>
  </nav>

  <main id="app"></main>

  <div class="toast" id="toast"></div>

  <footer class="foot">
    Fan-made calculator inspired by MapleScouter, adapted for GMS. Estimates only — not affiliated with Nexon.
    <a href="../index.html">← Probability &amp; Stats Hub</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/items.js"></script>
  <script src="js/income.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
